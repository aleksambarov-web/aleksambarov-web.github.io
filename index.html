<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Accounts Manager</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
        }
        h1 { font-size: 20px; margin-bottom: 16px; }
        h2 { font-size: 16px; margin: 20px 0 12px; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn {
            flex: 1; min-width: 100px; padding: 12px;
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color, #000000);
            border: none; border-radius: 8px;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .tab-btn.active {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        
        .content { display: none; }
        .content.active { display: block; }
        
        .form-container {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px; padding: 16px; margin-bottom: 20px;
        }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: var(--tg-theme-hint-color, #666666); margin-bottom: 4px; }
        input {
            width: 100%; padding: 10px 12px;
            border: 1px solid var(--tg-theme-button-color, #3390ec);
            border-radius: 8px; font-size: 14px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        input:focus { outline: none; border-color: var(--tg-theme-button-color, #3390ec); }
        button.action-btn {
            width: 100%; padding: 12px;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none; border-radius: 8px;
            font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px;
        }
        
        .accounts-list { margin-top: 10px; }
        .account-card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px; padding: 16px;
            margin-bottom: 12px; cursor: pointer;
        }
        .account-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .account-preview { font-size: 13px; color: var(--tg-theme-hint-color, #666666); }
        .account-id { font-size: 11px; color: var(--tg-theme-hint-color, #999999); margin-top: 6px; }
        
        .modal {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center; justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background-color: var(--tg-theme-bg-color, #ffffff);
            border-radius: 16px; padding: 20px;
            width: 90%; max-width: 400px;
            max-height: 80vh; overflow-y: auto;
        }
        .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
        .detail-row { margin-bottom: 16px; }
        .detail-label { font-size: 12px; color: var(--tg-theme-hint-color, #666666); margin-bottom: 4px; }
        .detail-value {
            font-size: 14px; padding: 10px;
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 8px; word-break: break-all;
        }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .modal-buttons button { flex: 1; min-width: 100px; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--tg-theme-hint-color, #666666); }
        .delete-btn { background-color: #ff4444; margin-top: 10px; }
        .copy-btn { background-color: #44aa44; margin-top: 10px; }
        .sell-btn { background-color: #ff8800; margin-top: 10px; }
        
        .stats-card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px; padding: 16px;
            margin-bottom: 20px; text-align: center;
        }
        .stats-value { font-size: 24px; font-weight: 700; color: var(--tg-theme-button-color, #3390ec); margin-top: 8px; }
        
        .chart-container {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px; padding: 16px; margin-top: 20px;
        }
        .chart-bar { display: flex; align-items: flex-end; height: 150px; gap: 8px; padding: 10px 0; }
        .chart-column {
            flex: 1; background-color: var(--tg-theme-button-color, #3390ec);
            border-radius: 4px 4px 0 0; min-height: 4px; position: relative;
        }
        .chart-label { font-size: 10px; text-align: center; margin-top: 4px; color: var(--tg-theme-hint-color, #666666); }
        .chart-value {
            position: absolute; top: -18px; left: 50%;
            transform: translateX(-50%); font-size: 10px;
            font-weight: 600; white-space: nowrap;
        }
    </style>
</head>
<body>
    <h1>🎮 Менеджер аккаунтов</h1>
    
    <div class="tabs">
        <button class="tab-btn" onclick="switchTab('add')">➕ Добавить</button>
        <button class="tab-btn" onclick="switchTab('list')">📋 Аккаунты</button>
        <button class="tab-btn" onclick="switchTab('sold')">💰 Проданные</button>
        <button class="tab-btn" onclick="switchTab('stats')">📊 Статистика</button>
    </div>
    
    <div id="addTab" class="content">
        <div class="form-container">
            <div class="form-group">
                <label>1. Пароль от игры</label>
                <input type="text" id="gamePassword" placeholder="Введите пароль">
            </div>
            <div class="form-group">
                <label>2. Почта от игры</label>
                <input type="email" id="gameEmail" placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label>3. Пароль от почты</label>
                <input type="text" id="emailPassword" placeholder="Введите пароль">
            </div>
            <div class="form-group">
                <label>4. Название лота</label>
                <input type="text" id="lotName" placeholder="Например: AK-47 | Asiimov">
            </div>
            <div class="form-group">
                <label>5. Цена</label>
                <input type="text" id="price" placeholder="Например: 5000 руб">
            </div>
            <button class="action-btn" onclick="saveAccount()">💾 Сохранить</button>
        </div>
    </div>
    
    <div id="listTab" class="content">
        <div id="accountsList" class="accounts-list">
            <div class="empty-state">Нет сохранённых аккаунтов</div>
        </div>
    </div>
    
    <div id="soldTab" class="content">
        <div id="soldList" class="accounts-list">
            <div class="empty-state">Нет проданных лотов</div>
        </div>
    </div>
    
    <div id="statsTab" class="content">
        <div class="stats-card">
            <div>💰 Общий заработок</div>
            <div class="stats-value" id="totalEarnings">0 руб</div>
        </div>
        <div class="stats-card">
            <div>📦 Продано лотов</div>
            <div class="stats-value" id="totalSold">0</div>
        </div>
        <div class="chart-container">
            <h2 style="margin-top: 0;">📈 Заработок по дням</h2>
            <div id="chartContainer" style="margin-top: 16px;"></div>
        </div>
    </div>
    
    <div id="accountModal" class="modal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">Детали аккаунта</div>
            <div id="modalDetails"></div>
            <div class="modal-buttons">
                <button onclick="closeModal()">Закрыть</button>
                <button class="copy-btn" onclick="copyAll()">📋 Копировать</button>
                <button class="sell-btn" onclick="markAsSold()">✅ Продан</button>
                <button class="delete-btn" onclick="deleteCurrentAccount()">🗑️ Удалить</button>
            </div>
        </div>
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let accounts = [];
        let soldAccounts = [];
        let currentAccountId = null;
        let currentTab = 'list';

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.content').forEach(content => content.classList.remove('active'));
            
            const tabIndexes = { 'add': 1, 'list': 2, 'sold': 3, 'stats': 4 };
            document.querySelector(`.tab-btn:nth-child(${tabIndexes[tabName]})`).classList.add('active');
            document.getElementById(`${tabName}Tab`).classList.add('active');
            
            currentTab = tabName;
            
            if (tabName === 'list') renderAccounts();
            if (tabName === 'sold') renderSoldAccounts();
            if (tabName === 'stats') renderStats();
        }

        async function loadData() {
            return new Promise((resolve) => {
                tg.CloudStorage.getItems(['game_accounts', 'sold_accounts'], (err, result) => {
                    if (err) {
                        console.error('Ошибка загрузки:', err);
                        accounts = [];
                        soldAccounts = [];
                    } else {
                        try {
                            accounts = result['game_accounts'] ? JSON.parse(result['game_accounts']) : [];
                            soldAccounts = result['sold_accounts'] ? JSON.parse(result['sold_accounts']) : [];
                        } catch (e) {
                            console.error('Ошибка парсинга:', e);
                            accounts = [];
                            soldAccounts = [];
                        }
                    }
                    resolve();
                });
            });
        }

        async function saveData() {
            const items = {
                'game_accounts': JSON.stringify(accounts),
                'sold_accounts': JSON.stringify(soldAccounts)
            };
            tg.CloudStorage.setItems(items, (err) => {
                if (err) {
                    console.error('Ошибка сохранения:', err);
                    tg.showAlert('Ошибка сохранения: ' + err);
                } else {
                    console.log('Данные успешно сохранены');
                }
            });
        }

        function renderAccounts() {
            const container = document.getElementById('accountsList');
            if (accounts.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет сохранённых аккаунтов<br><br>Перейдите на вкладку "Добавить" чтобы создать первый аккаунт</div>';
                return;
            }
            container.innerHTML = accounts.map((acc, index) => `
                <div class="account-card" onclick="viewAccount(${index}, 'list')">
                    <div class="account-title">📦 ${escapeHtml(acc.lotName)}</div>
                    <div class="account-preview">💰 ${escapeHtml(acc.price)}<br>📧 ${escapeHtml(acc.gameEmail)}</div>
                    <div class="account-id">ID: ${acc.id}</div>
                </div>
            `).join('');
        }

        function renderSoldAccounts() {
            const container = document.getElementById('soldList');
            if (soldAccounts.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет проданных лотов<br><br>Отметьте аккаунт как проданный в деталях</div>';
                return;
            }
            container.innerHTML = soldAccounts.map((acc, index) => `
                <div class="account-card" onclick="viewAccount(${index}, 'sold')">
                    <div class="account-title">✅ ${escapeHtml(acc.lotName)}</div>
                    <div class="account-preview">💰 ${escapeHtml(acc.price)}<br>📅 Продан: ${new Date(acc.soldAt).toLocaleDateString()}</div>
                </div>
            `).join('');
        }

        function renderStats() {
            const totalEarnings = soldAccounts.reduce((sum, acc) => {
                const price = parseFloat(acc.price.replace(/[^0-9.]/g, '')) || 0;
                return sum + price;
            }, 0);
            
            document.getElementById('totalEarnings').textContent = totalEarnings.toLocaleString() + ' руб';
            document.getElementById('totalSold').textContent = soldAccounts.length;
            
            const days = {};
            soldAccounts.forEach(acc => {
                const date = new Date(acc.soldAt).toLocaleDateString();
                const price = parseFloat(acc.price.replace(/[^0-9.]/g, '')) || 0;
                days[date] = (days[date] || 0) + price;
            });
            
            const sortedDays = Object.entries(days).sort((a, b) => new Date(a[0]) - new Date(b[0])).slice(-7);
            const maxValue = Math.max(...sortedDays.map(d => d[1]), 1);
            
            const chartHTML = sortedDays.map(([date, value]) => `
                <div style="flex: 1; display: flex; flex-direction: column; align-items: center;">
                    <div class="chart-column" style="height: ${(value / maxValue) * 100}%; position: relative;">
                        <div class="chart-value">${value.toLocaleString()}</div>
                    </div>
                    <div class="chart-label">${date.split('.').slice(0, 2).join('.')}</div>
                </div>
            `).join('');
            
            document.getElementById('chartContainer').innerHTML = `<div class="chart-bar">${chartHTML}</div>`;
        }

        async function saveAccount() {
            const gamePassword = document.getElementById('gamePassword').value.trim();
            const gameEmail = document.getElementById('gameEmail').value.trim();
            const emailPassword = document.getElementById('emailPassword').value.trim();
            const lotName = document.getElementById('lotName').value.trim();
            const price = document.getElementById('price').value.trim();

            if (!gamePassword || !gameEmail || !emailPassword || !lotName || !price) {
                tg.showAlert('Пожалуйста, заполните все поля!');
                return;
            }

            const newAccount = {
                id: Date.now(),
                gamePassword,
                gameEmail,
                emailPassword,
                lotName,
                price,
                createdAt: new Date().toISOString()
            };

            accounts.unshift(newAccount);
            await saveData();
            
            document.getElementById('gamePassword').value = '';
            document.getElementById('gameEmail').value = '';
            document.getElementById('emailPassword').value = '';
            document.getElementById('lotName').value = '';
            document.getElementById('price').value = '';

            tg.showAlert('✅ Аккаунт сохранён!');
            renderAccounts();
        }

        function viewAccount(index, tab) {
            currentAccountId = index;
            currentTab = tab;
            const acc = tab === 'list' ? accounts[index] : soldAccounts[index];
            const isSold = tab === 'sold';
            
            document.getElementById('modalTitle').textContent = isSold ? 'Проданный лот' : 'Детали аккаунта';
            
            const details = `
                <div class="detail-row"><div class="detail-label">1. Пароль от игры</div><div class="detail-value">${escapeHtml(acc.gamePassword)}</div></div>
                <div class="detail-row"><div class="detail-label">2. Почта от игры</div><div class="detail-value">${escapeHtml(acc.gameEmail)}</div></div>
                <div class="detail-row"><div class="detail-label">3. Пароль от почты</div><div class="detail-value">${escapeHtml(acc.emailPassword)}</div></div>
                <div class="detail-row"><div class="detail-label">4. Название лота</div><div class="detail-value">${escapeHtml(acc.lotName)}</div></div>
                <div class="detail-row"><div class="detail-label">5. Цена</div><div class="detail-value">${escapeHtml(acc.price)}</div></div>
            `;
            
            document.getElementById('modalDetails').innerHTML = details;
            document.getElementById('accountModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('accountModal').classList.remove('active');
            currentAccountId = null;
        }

        function copyAll() {
            if (currentAccountId === null) return;
            const acc = currentTab === 'list' ? accounts[currentAccountId] : soldAccounts[currentAccountId];
            const text = `Пароль от игры: ${acc.gamePassword}\nПочта от игры: ${acc.gameEmail}\nПароль от почты: ${acc.emailPassword}\nНазвание лота: ${acc.lotName}\nЦена: ${acc.price}`;
            navigator.clipboard.writeText(text).then(() => {
                tg.showAlert('📋 Все данные скопированы в буфер обмена!');
            }).catch(() => {
                tg.showAlert('❌ Не удалось скопировать');
            });
        }

        async function markAsSold() {
            if (currentAccountId === null) return;
            tg.showConfirm('Отметить этот аккаунт как проданный?', async (confirmed) => {
                if (confirmed) {
                    const acc = accounts[currentAccountId];
                    acc.soldAt = new Date().toISOString();
                    soldAccounts.unshift(acc);
                    accounts.splice(currentAccountId, 1);
                    await saveData();
                    closeModal();
                    renderAccounts();
                    tg.showAlert('✅ Аккаунт отмечен как проданный!');
                }
            });
        }

        async function deleteCurrentAccount() {
            if (currentAccountId === null) return;
            tg.showConfirm('Вы уверены, что хотите удалить этот аккаунт?', async (confirmed) => {
                if (confirmed) {
                    if (currentTab === 'list') {
                        accounts.splice(currentAccountId, 1);
                    } else {
                        soldAccounts.splice(currentAccountId, 1);
                    }
                    await saveData();
                    if (currentTab === 'list') renderAccounts();
                    else renderSoldAccounts();
                    closeModal();
                    tg.showAlert('🗑️ Аккаунт удалён');
                }
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        (async () => {
            await loadData();
            renderAccounts();
        })();
    </script>
</body>
</html>
